spring:
  application:
    name: yangstagram

  # 백엔드 실행 시 루트의 compose.yaml(PostgreSQL)을 자동으로 띄운다.
  # start-only: 백엔드를 꺼도 DB 컨테이너는 계속 실행 (재시작이 빨라짐)
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

  # PostgreSQL JIT 끄기: events 표가 커지면(large 약 170만 건) 비용 추정이 높아져 JIT 컴파일이 매번 일어나고,
  # 10ms짜리 피드 쿼리가 0.8초가 된다. 이 앱의 쿼리는 짧아서 JIT 이득이 없다.
  datasource:
    hikari:
      connection-init-sql: set jit = off

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway가 만들고, JPA는 검증만 한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  # 게시물 하나에 사진 최대 20장 (화면에서 1080px로 줄여서 보내므로 한 장 1MB 안팎)
  servlet:
    multipart:
      max-file-size: 200MB   # 릴스 영상 (사진은 화면에서 줄여 보내 1MB 안팎)
      max-request-size: 220MB

server:
  port: 8080

# 콘솔과 함께 파일에도 남긴다 (storage/는 Git 제외). 7일·파일당 10MB까지
logging:
  file:
    name: ../storage/logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

yangstagram:
  # 가짜 데이터: DB가 비어 있으면 시작할 때 자동 생성
  seed:
    on-startup-if-empty: true
    size: medium   # M2부터 medium (사용자 200명, 약 20초)
    value: 42
    # 모든 가짜 계정의 비밀번호 (연구용)
    fake-password: yang1234
  lab:
    enabled: true
  # 업로드 파일과 가짜 데이터 사진 위치 (backend 폴더 기준)
  media:
    storage-dir: ../storage
    seed-dir: ../seed-media/photos
