spring:
  application:
    name: yangstagram

  # 백엔드 실행 시 루트의 compose.yaml(PostgreSQL)을 자동으로 띄운다.
  # start-only: 백엔드를 꺼도 DB 컨테이너는 계속 실행 (재시작이 빨라짐)
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway가 만들고, JPA는 검증만 한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  # 게시물 하나에 사진 최대 20장 (화면에서 1080px로 줄여서 보내므로 한 장 1MB 안팎)
  servlet:
    multipart:
      max-file-size: 200MB   # 릴스 영상 (사진은 화면에서 줄여 보내 1MB 안팎)
      max-request-size: 220MB

server:
  port: 8080

yangstagram:
  # 가짜 데이터: DB가 비어 있으면 시작할 때 자동 생성
  seed:
    on-startup-if-empty: true
    size: medium   # M2부터 medium (사용자 200명, 약 20초)
    value: 42
    # 모든 가짜 계정의 비밀번호 (연구용)
    fake-password: yang1234
  lab:
    enabled: true
  # 업로드 파일과 가짜 데이터 사진 위치 (backend 폴더 기준)
  media:
    storage-dir: ../storage
    seed-dir: ../seed-media/photos
